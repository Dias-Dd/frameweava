[package]
name = "fw-rigid-body-module"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rapier = { package = "rapier3d-f64", version = "=0.36.1", default-features = false, features = ["dim3", "f64", "std", "serde-serialize", "enhanced-determinism", "solver-bounds-checks"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }

[profile.release]
opt-level = 3
panic = "abort"
strip = true
codegen-units = 1
lto = true
