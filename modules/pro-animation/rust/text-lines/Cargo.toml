[package]
name = "frameweave-pa3-text-lines"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "fw_bindgen_module"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
unicode-bidi = "=0.3.18"
unicode-script = "=0.5.7"
unicode-segmentation = "=1.12.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
