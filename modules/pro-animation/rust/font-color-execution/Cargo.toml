[package]
name = "fw_bindgen_module"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
harfrust = "=0.15.0"
skrifa = "=0.49.0"
read-fonts = "=0.46.0"
smallvec = "=1.16.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
