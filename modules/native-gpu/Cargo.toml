[package]
name = "frameweave-native-gpu"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
license = "Apache-2.0"

[features]
default = []
# Development-only explicit readback. Not compiled into the shipped hot path.
diagnostics = []
# Opt-in for Linux EGL/WSLg deployments. Vulkan remains the default.
gles = ["wgpu/gles"]

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "metal", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
pollster = "=0.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ash = "=0.38.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio"] }
libloading = "=0.8.9"
sha2 = "=0.10.9"
getrandom = "=0.3.4"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
